# vmselect and vmalert both already expose their own path prefixes
# (/select/<account>/... and /vmalert/, /api/v1/rules) so one host can
# front both without any rewrite rules — no prefix collision between them.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vm-cluster
  namespace: observability
spec:
  ingressClassName: nginx
  rules:
    - host: vm-cluster.localhost
      http:
        paths:
          - path: /select
            pathType: Prefix
            backend:
              service:
                name: vmselect
                port:
                  number: 8481
          - path: /vmalert
            pathType: Prefix
            backend:
              service:
                name: vmalert
                port:
                  number: 8880
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vmalert
                port:
                  number: 8880
