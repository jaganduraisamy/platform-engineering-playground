# VictoriaMetrics cluster mode (vminsert/vmstorage/vmselect), hand-written
# like 11_thanos/thanos-stack.yaml instead of the victoria-metrics-cluster
# Helm chart, specifically so every arg/port/volume is visible here rather
# than hidden behind chart defaults — the point of this file is the
# component tour, not the shortest path to a running cluster.
#
# Runs ALONGSIDE vmsingle (Helm-deployed, 12_victoria-metrics/vm-helm-values.yaml),
# not instead of it. vmsingle is this repo's actual Thanos replacement at its
# current scale; this stack exists so vminsert/vmstorage/vmselect/vmalert can
# be seen running as separate pods, the same reason 11_thanos stood up
# Sidecar/Store Gateway/Compactor/Querier even though step 4 only runs one
# Prometheus.
#
# vmstorage: the actual store. StatefulSet (not Deployment) because vminsert
# and vmselect address each replica by its stable pod DNS name directly
# (vmstorage-0.vmstorage, vmstorage-1.vmstorage) — VM cluster mode has no
# DNS-SRV auto-discovery the way Thanos Query's `dnssrv+_grpc._tcp.` does;
# adding a 3rd vmstorage replica means editing vminsert/vmselect's
# -storageNode flags here, not just scaling a Service. Worth flagging as a
# real operational gap vs Thanos.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vmstorage
  namespace: observability
spec:
  serviceName: vmstorage
  replicas: 2
  selector:
    matchLabels:
      app: vmstorage
  template:
    metadata:
      labels:
        app: vmstorage
    spec:
      containers:
        - name: vmstorage
          image: victoriametrics/vmstorage:v1.153.0-cluster
          args:
            - --storageDataPath=/storage
            - --httpListenAddr=:8482
            - --vminsertAddr=:8400
            - --vmselectAddr=:8401
            - --retentionPeriod=10d
          ports:
            - name: http
              containerPort: 8482
            - name: vminsert
              containerPort: 8400
            - name: vmselect
              containerPort: 8401
          volumeMounts:
            - name: vmstorage-data
              mountPath: /storage
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        # emptyDir, not a PVC — matches this repo's convention (every LGTM
        # component except MinIO, see 11_thanos/README.md); losing vmstorage
        # data on pod restart is acceptable for a wiring-focused homelab lab.
        - name: vmstorage-data
          emptyDir: {}
---
# Headless Service: vminsert/vmselect need per-pod addressing
# (vmstorage-0.vmstorage, vmstorage-1.vmstorage), not a load-balanced VIP.
apiVersion: v1
kind: Service
metadata:
  name: vmstorage
  namespace: observability
spec:
  clusterIP: None
  selector:
    app: vmstorage
  ports:
    - name: http
      port: 8482
      targetPort: 8482
    - name: vminsert
      port: 8400
      targetPort: 8400
    - name: vmselect
      port: 8401
      targetPort: 8401
---
# vminsert: stateless write router. Shards incoming remote_write samples
# across both vmstorage replicas; -replicationFactor=2 means every sample
# is written to both, so losing one vmstorage pod loses zero data — the
# actual HA property 11_thanos's single-Prometheus setup could wire
# (external_labels.replica) but never had a second replica to prove.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vminsert
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vminsert
  template:
    metadata:
      labels:
        app: vminsert
    spec:
      containers:
        - name: vminsert
          image: victoriametrics/vminsert:v1.153.0-cluster
          args:
            - --httpListenAddr=:8480
            - --replicationFactor=2
            - --storageNode=vmstorage-0.vmstorage.observability.svc.cluster.local:8400
            - --storageNode=vmstorage-1.vmstorage.observability.svc.cluster.local:8400
          ports:
            - name: http
              containerPort: 8480
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vminsert
  namespace: observability
spec:
  selector:
    app: vminsert
  ports:
    - name: http
      port: 8480
      targetPort: 8480
---
# vmselect: stateless query fan-out. Reads from both vmstorage replicas and
# merges; -dedup.minScrapeInterval must match Prometheus's scrape_interval
# (15s, see step 4's prometheus-config) so duplicate samples from
# replicationFactor=2 collapse back into one series instead of double-
# counting — the direct equivalent of Thanos Querier's
# --query.replica-label dedup, just keyed on timestamp+value instead of a
# replica label.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmselect
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmselect
  template:
    metadata:
      labels:
        app: vmselect
    spec:
      containers:
        - name: vmselect
          image: victoriametrics/vmselect:v1.153.0-cluster
          args:
            - --httpListenAddr=:8481
            - --dedup.minScrapeInterval=15s
            - --storageNode=vmstorage-0.vmstorage.observability.svc.cluster.local:8401
            - --storageNode=vmstorage-1.vmstorage.observability.svc.cluster.local:8401
          ports:
            - name: http
              containerPort: 8481
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vmselect
  namespace: observability
spec:
  selector:
    app: vmselect
  ports:
    - name: http
      port: 8481
      targetPort: 8481
---
# vmalert: evaluates recording/alerting rules against vmselect's query API
# (the Thanos Ruler equivalent — "needed when a rule has to see the global
# view, not one process's local data"). -notifier.blackhole discards fired
# alerts instead of sending them to Alertmanager: this repo has no
# Alertmanager and adding one is out of scope for this step (AGENTS.md:
# avoid introducing multiple new tools in one change) — vmalert still
# evaluates and exposes results on its own UI/API either way.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
  namespace: observability
data:
  rules.yml: |
    groups:
      - name: vm-cluster-demo
        interval: 30s
        rules:
          - record: job:traces_span_metrics_calls:rate5m
            expr: sum(rate(traces_span_metrics_calls_total[5m])) by (job)
          - alert: PrometheusTargetMissing
            expr: up == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Target {{ $labels.instance }} down"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalert
  template:
    metadata:
      labels:
        app: vmalert
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.153.0
          args:
            - --httpListenAddr=:8880
            - --datasource.url=http://vmselect.observability.svc.cluster.local:8481/select/0/prometheus
            - --remoteWrite.url=http://vminsert.observability.svc.cluster.local:8480/insert/0/prometheus
            - --remoteRead.url=http://vmselect.observability.svc.cluster.local:8481/select/0/prometheus
            - --rule=/etc/vmalert/rules.yml
            - --notifier.blackhole
            - --evaluationInterval=30s
          ports:
            - name: http
              containerPort: 8880
          volumeMounts:
            - name: vmalert-rules
              mountPath: /etc/vmalert
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: vmalert-rules
          configMap:
            name: vmalert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  namespace: observability
spec:
  selector:
    app: vmalert
  ports:
    - name: http
      port: 8880
      targetPort: 8880
