apiVersion: v1
kind: Secret
metadata:
  name: thanos-objstore-config
  namespace: observability
type: Opaque
stringData:
  objstore.yml: |
    type: S3
    config:
      bucket: "thanos"
      endpoint: "seaweedfs.observability.svc.cluster.local:8333"
      access_key: "thanosadmin"
      secret_key: "thanosadmin"
      insecure: true
